# Runs the official PLE `kit check` on GitHub-hosted Ubuntu, which has a real
# Docker daemon. This VM has no Docker, so `kit check` cannot run here.
# Trigger manually, or on every push to main.
# Needs one repo secret: DEEPSEEK_API_KEY (your DeepSeek API key).
# It is passed as MODEL_API_KEY; it never lands in the repo or logs
# (kit redacts keys in check.json / console output).
# NOTE: the entry's submission.yaml declares google-cloud/claude-opus-5-5,
# and `kit check` has no --model flag (--model-base-url is rejected for
# google-cloud models). CI therefore checks a throwaway copy with the model
# switched back to DeepSeek, so the harness is still exercised end to end;
# the real submission.yaml is untouched.
name: kit-check

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  kit-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out harness (this repo is the entry)
        uses: actions/checkout@v4

      - name: Clone the official PLE kit
        run: git clone --depth 1 https://github.com/google-research/ple ple-kit

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run kit check (DeepSeek test copy)
        env:
          MODEL_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # See the header note: check a copy with the model switched back
          # to DeepSeek; the real submission.yaml stays google-cloud.
          cp -r "$GITHUB_WORKSPACE" /tmp/entry-deepseek
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("/tmp/entry-deepseek/submission.yaml")
          t = p.read_text()
          t = t.replace(
              "model_api: google-cloud/claude-opus-5-5",
              "model_api: openai-compatible/deepseek-flash\nmodel_base_url: https://llm.example.org/v1",
          )
          p.write_text(t)
          EOF
          grep -E "model_api|model_base_url" /tmp/entry-deepseek/submission.yaml
          cd ple-kit
          uv run python -m kit check /tmp/entry-deepseek \
            --model-base-url https://api.deepseek.com/v1

      - name: Upload kit check logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kit-check-logs
          path: ~/.cache/plebench/
          if-no-files-found: ignore
